<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>타로 랜덤 카드</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;
            padding: 0;

            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;

            text-align: center;

            background: #f7f3ee;

            color: #333;
        }


        /* =========================
           전체 영역
        ========================= */

        .container {

            width: 100%;

            max-width: 700px;

            margin: 0 auto;

            padding: 60px 20px;
        }


        /* =========================
           제목
        ========================= */

        h1 {

            margin: 0 0 30px;

            font-size: 36px;

            font-weight: 600;

            letter-spacing: -1px;
        }


        /* =========================
           카드 뽑기 버튼
        ========================= */

        #drawButton {

            padding: 16px 38px;

            border: none;

            border-radius: 50px;

            background: #333;

            color: white;

            font-size: 18px;

            font-weight: 500;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }


        #drawButton:hover {

            background: #555;

            transform: translateY(-2px);
        }


        #drawButton:active {

            transform: translateY(0);
        }


        #drawButton:disabled {

            background: #aaa;

            cursor: default;

            transform: none;
        }


        /* =========================
           결과 영역
        ========================= */

        #result {

            margin-top: 50px;

            min-height: 500px;
        }


        /* =========================
           카운트다운
        ========================= */

        #countdown {

            display: none;

            height: 500px;

            align-items: center;

            justify-content: center;

            font-size: 100px;

            font-weight: 600;

            color: #333;
        }


        #countdownNumber {

            display: block;

            animation:
                countdownFade 1s ease;
        }


        @keyframes countdownFade {

            0% {

                opacity: 0;

                transform: scale(1.3);
            }


            30% {

                opacity: 1;

                transform: scale(1);
            }


            70% {

                opacity: 1;

                transform: scale(1);
            }


            100% {

                opacity: 0;

                transform: scale(0.8);
            }

        }


        /* =========================
           카드 결과
        ========================= */

        #cardResult {

            display: none;

            opacity: 0;

            transform: translateY(10px);

            transition:
                opacity 0.5s ease,
                transform 0.5s ease;
        }


        #cardResult.show {

            opacity: 1;

            transform: translateY(0);
        }


        /* =========================
           카드 이미지
        ========================= */

        #cardImage {

            display: block;

            width: auto;

            max-width: 100%;

            max-height: 500px;

            margin: 0 auto 30px;

            border-radius: 12px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.15);
        }


        /* =========================
           카드 텍스트
        ========================= */

        #cardText {

            max-width: 600px;

            margin: 0 auto;

            font-size: 20px;

            line-height: 1.8;

            letter-spacing: -0.3px;

            word-break: keep-all;
        }


        /* =========================
           모바일
        ========================= */

        @media (max-width: 600px) {

            .container {

                padding: 40px 15px;
            }


            h1 {

                font-size: 28px;
            }


            #countdown {

                font-size: 80px;
            }


            #cardImage {

                max-height: 420px;
            }


            #cardText {

                font-size: 17px;
            }

        }

    </style>

</head>



<body>


<div class="container">


    <h1>
        타로 랜덤 카드
    </h1>


    <button id="drawButton">
        카드 뽑기
    </button>


    <div id="result">


        <!-- =========================
             카운트다운
        ========================== -->

        <div id="countdown">

            <span id="countdownNumber"></span>

        </div>



        <!-- =========================
             카드 결과
        ========================== -->

        <div id="cardResult">


            <img
                id="cardImage"
                src=""
                alt="타로 카드"
            >


            <div id="cardText"></div>


        </div>


    </div>


</div>



<script>


/* =====================================================
   데이터 파일
===================================================== */

const IMAGE_DATA_URL =
    "https://raw.githubusercontent.com/softsweettarot/Message/main/images.txt";


const TEXT_DATA_URL =
    "https://raw.githubusercontent.com/softsweettarot/Message/main/texts.txt";



/* =====================================================
   배열
===================================================== */

let images = [];

let texts = [];



/* =====================================================
   Google Drive URL 변환
===================================================== */

function convertGoogleDriveUrl(url) {

    url = url.trim();


    const match =
        url.match(
            /\/d\/([a-zA-Z0-9_-]+)/
        );


    if (match) {

        const fileId = match[1];


        return (
            "https://drive.google.com/thumbnail" +
            "?id=" +
            fileId +
            "&sz=w1000"
        );

    }


    return url;
}



/* =====================================================
   데이터 불러오기
===================================================== */

async function loadData() {

    try {


        const [
            imageResponse,
            textResponse
        ] = await Promise.all([

            fetch(IMAGE_DATA_URL),

            fetch(TEXT_DATA_URL)

        ]);



        if (!imageResponse.ok) {

            throw new Error(
                "images.txt 불러오기 실패"
            );

        }



        if (!textResponse.ok) {

            throw new Error(
                "texts.txt 불러오기 실패"
            );

        }



        const imageData =
            await imageResponse.text();


        const textData =
            await textResponse.text();



        /* =========================
           이미지 배열
        ========================= */

        images = imageData

            .split(/\r?\n/)

            .map(line =>
                line.trim()
            )

            .filter(line =>
                line !== ""
            )

            .map(line =>
                convertGoogleDriveUrl(line)
            );



        /* =========================
           텍스트 배열
        ========================= */

        texts = textData

            .split(/\r?\n/)

            .map(line =>
                line.trim()
            )

            .filter(line =>
                line !== ""
            );



        /* =========================
           배열 개수 확인
        ========================= */

        if (
            images.length !==
            texts.length
        ) {

            console.error(
                "이미지와 텍스트 개수가 다릅니다."
            );

            return;
        }



        /*
         * 모든 이미지를 백그라운드에서
         * 미리 로딩
         */

        preloadAllImages();



    } catch (error) {

        /*
         * 오류를 콘솔에만 표시합니다.
         *
         * 화면에는 오류 문구를
         * 표시하지 않습니다.
         */

        console.error(
            "데이터 로딩 오류:",
            error
        );

    }

}



/* =====================================================
   모든 이미지 미리 로딩
===================================================== */

function preloadAllImages() {


    images.forEach(url => {


        const img =
            new Image();


        img.src = url;


    });

}



/* =====================================================
   선택한 이미지 미리 로딩
===================================================== */

function preloadImage(url) {


    return new Promise(
        (resolve, reject) => {


            const img =
                new Image();



            img.onload =
                function() {

                    resolve(img);

                };



            img.onerror =
                function() {

                    reject(
                        new Error(
                            "이미지 로딩 실패"
                        )
                    );

                };



            img.src = url;


        }
    );

}



/* =====================================================
   카드 뽑기
===================================================== */

async function drawCard() {


    /* =========================
       데이터 확인
    ========================= */

    if (
        images.length === 0 ||
        texts.length === 0
    ) {

        /*
         * 사용자에게 오류 문구를
         * 보여주지 않고 콘솔에만 기록
         */

        console.error(
            "카드 데이터를 불러오지 못했습니다."
        );

        return;
    }



    if (
        images.length !==
        texts.length
    ) {

        console.error(
            "이미지와 텍스트의 개수가 일치하지 않습니다."
        );

        return;
    }



    /* =========================
       버튼 비활성화
    ========================= */

    const button =
        document.getElementById(
            "drawButton"
        );


    button.disabled = true;



    /* =========================
       기존 카드 숨기기
    ========================= */

    const cardResult =
        document.getElementById(
            "cardResult"
        );


    cardResult.classList.remove(
        "show"
    );


    cardResult.style.display =
        "none";



    /* =========================
       랜덤 카드 선택
    ========================= */

    const randomIndex =
        Math.floor(
            Math.random() *
            images.length
        );


    const selectedImage =
        images[randomIndex];


    const selectedText =
        texts[randomIndex];



    /*
     * 배열 번호는 화면에 표시하지 않습니다.
     * 개발자 콘솔에서만 확인할 수 있습니다.
     */

    console.log(
        "선택된 카드:",
        randomIndex
    );



    /* =========================
       이미지 미리 로딩 시작
    ========================= */

    const imagePromise =
        preloadImage(
            selectedImage
        );



    /* =========================
       카운트다운 표시
    ========================= */

    const countdown =
        document.getElementById(
            "countdown"
        );


    const countdownNumber =
        document.getElementById(
            "countdownNumber"
        );


    countdown.style.display =
        "flex";



    /* =========================
       5 → 4 → 3 → 2 → 1
    ========================= */

    for (
        let number = 5;
        number >= 1;
        number--
    ) {


        countdownNumber.textContent =
            number;



        /*
         * 애니메이션 초기화
         */

        countdownNumber.style.animation =
            "none";



        void countdownNumber.offsetWidth;



        countdownNumber.style.animation =
            "countdownFade 1s ease";



        /*
         * 1초 대기
         */

        await wait(1000);

    }



    /* =========================
       카운트다운 종료
    ========================= */

    countdown.style.display =
        "none";



    /* =========================
       이미지 준비 대기
    ========================= */

    try {

        await imagePromise;

    } catch (error) {

        /*
         * 오류 메시지를 화면에 표시하지 않습니다.
         * 콘솔에서만 확인할 수 있습니다.
         */

        console.error(
            "이미지를 불러오지 못했습니다.",
            error
        );


        button.disabled =
            false;


        return;
    }



    /* =========================
       이미지 + 텍스트 준비
    ========================= */

    const cardImage =
        document.getElementById(
            "cardImage"
        );


    const cardText =
        document.getElementById(
            "cardText"
        );



    cardImage.src =
        selectedImage;


    cardText.textContent =
        selectedText;



    /* =========================
       카드 표시
    ========================= */

    cardResult.style.display =
        "block";



    /*
     * 이미지와 텍스트가
     * 동시에 자연스럽게 나타남
     */

    requestAnimationFrame(() => {


        requestAnimationFrame(() => {


            cardResult.classList.add(
                "show"
            );


        });


    });



    /* =========================
       버튼 다시 활성화
    ========================= */

    button.disabled =
        false;

}



/* =====================================================
   대기 함수
===================================================== */

function wait(milliseconds) {


    return new Promise(
        resolve => {

            setTimeout(
                resolve,
                milliseconds
            );

        }
    );

}



/* =====================================================
   이미지 오류
===================================================== */

/*
 * 이미지 오류가 발생해도
 * 화면에는 아무런 오류 문구를
 * 표시하지 않습니다.
 */

document
    .getElementById("cardImage")
    .addEventListener(
        "error",
        function() {

            console.error(
                "이미지 불러오기 실패:",
                this.src
            );

        }
    );



/* =====================================================
   버튼 이벤트
===================================================== */

document
    .getElementById("drawButton")
    .addEventListener(
        "click",
        drawCard
    );



/* =====================================================
   페이지 시작
===================================================== */

loadData();


</script>


</body>

</html>
