<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>카드가 건네는 메시지</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:Arial,"Noto Sans KR",sans-serif;text-align:center;color:#333}
body{position:relative;background:#f8f4ed;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;inset:-20%;z-index:-3;pointer-events:none}
body:before{background:linear-gradient(115deg,transparent 20%,rgba(255,174,210,.28) 35%,rgba(224,185,255,.5) 45%,rgba(179,222,255,.38) 55%,rgba(255,205,229,.3) 65%,transparent 80%);filter:blur(25px);transform:rotate(-12deg) scale(1.5);animation:auroraWave 14s ease-in-out infinite alternate}
body:after{z-index:-2;background:linear-gradient(65deg,transparent 25%,rgba(180,225,255,.3) 38%,rgba(222,191,255,.48) 48%,rgba(255,184,216,.38) 58%,transparent 72%);filter:blur(32px);transform:rotate(14deg) scale(1.6);animation:auroraWave2 19s ease-in-out infinite alternate}
@keyframes auroraWave{0%{transform:translate(-15%,-5%) rotate(-18deg) scale(1.5);opacity:.65}25%{transform:translate(5%,8%) rotate(-8deg) scale(1.55);opacity:.85}50%{transform:translate(15%,-4%) rotate(4deg) scale(1.45);opacity:.72}75%{transform:translate(-3%,12%) rotate(12deg) scale(1.6);opacity:.9}100%{transform:translate(-18%,-2%) rotate(18deg) scale(1.5);opacity:.7}}
@keyframes auroraWave2{0%{transform:translate(18%,5%) rotate(18deg) scale(1.6);opacity:.55}25%{transform:translate(-4%,-8%) rotate(8deg) scale(1.5);opacity:.8}50%{transform:translate(-16%,5%) rotate(-5deg) scale(1.65);opacity:.65}75%{transform:translate(5%,-12%) rotate(-15deg) scale(1.55);opacity:.82}100%{transform:translate(20%,2%) rotate(-22deg) scale(1.6);opacity:.6}}
.container{max-width:800px;margin:0 auto;padding:70px 20px}
#topMenu.hidden{display:none}
#notice{margin:-10px 0 30px;font-size:14px;color:#888;letter-spacing:-.3px}
button{border:0;border-radius:30px;padding:14px 30px;background:#555;color:#fff;font-size:16px;cursor:pointer;transition:.3s}
button:hover{background:#333}
button:disabled{opacity:.5;cursor:default}
#intro{display:none;min-height:500px;align-items:center;justify-content:center;flex-direction:column}
#introText{font-size:28px;line-height:1.7;letter-spacing:-.5px;word-break:keep-all;opacity:0;transition:opacity .8s ease}
#introText.show{opacity:1}
#messageButton{display:none;margin-top:35px;opacity:0;transform:translateY(12px);transition:opacity 1.2s ease,transform 1.2s ease}
#messageButton.show{opacity:1;transform:translateY(0)}
#countdown{display:none;min-height:500px;align-items:center;justify-content:center}
#countdownNumber{font-size:80px;font-weight:300;color:#555}
@keyframes countdownFade{0%{opacity:0;transform:scale(1.15)}30%{opacity:1;transform:scale(1)}70%{opacity:1;transform:scale(.98)}100%{opacity:0;transform:scale(.9)}}
#cardResult{display:none;opacity:0;transition:opacity 1.5s ease}
#cardResult.show{opacity:1}
#cardImage{display:block;width:100%;max-width:500px;margin:0 auto 35px;border-radius:10px}
#cardText{font-size:20px;line-height:1.8;white-space:pre-line;word-break:keep-all}
#commentSection{max-width:600px;margin:55px auto 0;padding-top:30px;border-top:1px solid rgba(0,0,0,.1);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity 1.2s ease,transform 1.2s ease}
#commentSection.show{opacity:1;transform:translateY(0);pointer-events:auto}
#commentToggle{display:inline-block;background:none;color:#555;padding:5px 10px;font-size:16px}
#commentForm{display:none;margin-top:25px}
#commentGuide{font-size:14px;color:#888;line-height:1.7;margin-bottom:15px}
#commentInput{width:100%;height:110px;padding:15px;border:1px solid #ddd;border-radius:10px;resize:none;font-family:inherit;font-size:14px;background:rgba(255,255,255,.7)}
#commentSubmit{margin-top:12px}
#savedMessage{display:none;margin-top:15px;font-size:14px;color:#888}
@media(max-width:600px){
.container{padding:50px 18px}
#introText{font-size:23px}
#cardText{font-size:18px}
#countdownNumber{font-size:65px}
}
</style>
</head>
<body>
<div class="container">
<div id="topMenu">
<h1>카드가 건네는 메시지</h1>
<p id="notice">한 번의 질문, 한 번의 메시지만 효력</p>
<button id="startButton">시작하기</button>
</div>
<div id="intro">
<div id="introText"></div>
<button id="messageButton">메시지 받기</button>
</div>
<div id="countdown">
<div id="countdownNumber"></div>
</div>
<div id="cardResult">
<img id="cardImage" src="" alt="타로 카드">
<div id="cardText"></div>
<div id="commentSection">
<button id="commentToggle">한마디 남기기</button>
<div id="commentForm">
<div id="commentGuide">도움이 되셨나요?<br>느낀점이나 건의사항이 있으시면 남겨주세요.</div>
<textarea id="commentInput" placeholder="댓글은 말랑달콤 타로만 볼 수 있습니다."></textarea>
<button id="commentSubmit">등록</button>
<div id="savedMessage">댓글이 등록되었습니다.</div>
</div>
</div>
</div>
</div>
<script>
const IMAGE_DATA_URL="https://raw.githubusercontent.com/softsweettarot/Message/main/images.txt";
const TEXT_DATA_URL="https://raw.githubusercontent.com/softsweettarot/Message/main/texts.txt";
const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbw_Ka3rztRHsOMR30u8u5_tzObwHgZitSEtGXRIQCyBxEHeYw2C71N31gLyqMGDa88N/exec";
const $=id=>document.getElementById(id);
let images=[],texts=[];
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function preloadImage(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=reject;img.src=src})}
function convertDriveUrl(url){
const match=url.match(/(?:id=|\/d\/)([a-zA-Z0-9_-]+)/);
return match?`https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`:url
}
async function loadData(){
try{
const[imageRes,textRes]=await Promise.all([fetch(IMAGE_DATA_URL),fetch(TEXT_DATA_URL)]);
const[imageData,textData]=await Promise.all([imageRes.text(),textRes.text()]);
images=imageData.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(convertDriveUrl);
texts=textData.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)
}catch(e){console.error(e)}
}
async function showIntro(message,duration){
const text=$("introText");
text.textContent=message;
text.classList.remove("show");
requestAnimationFrame(()=>text.classList.add("show"));
await wait(duration);
text.classList.remove("show");
}
async function startExperience(){
$("topMenu").classList.add("hidden");
$("intro").style.display="flex";
await showIntro("카드로 알고 싶은 것을, 마음속에 떠올려보세요.",5000);
const text=$("introText"),button=$("messageButton");
button.classList.remove("show");
button.style.display="none";
setTimeout(()=>{
text.textContent="준비되셨다면, 버튼을 눌러 메시지를 받아보세요.";
text.classList.add("show");
setTimeout(()=>{
button.style.display="block";
requestAnimationFrame(()=>button.classList.add("show"));
},3000);
},800);
}
async function drawCard(){
if(!images.length||!texts.length||images.length!==texts.length)return;
const button=$("messageButton"),cardResult=$("cardResult"),input=$("commentInput"),commentSection=$("commentSection");
button.disabled=true;
cardResult.classList.remove("show");
cardResult.style.display="none";
commentSection.classList.remove("show");
input.value="";
$("savedMessage").style.display="none";
const i=Math.floor(Math.random()*images.length),image=images[i],text=texts[i];
const imagePromise=preloadImage(image);
const countdown=$("countdown"),number=$("countdownNumber");
$("intro").style.display="none";
countdown.style.display="flex";
for(let n=5;n>=1;n--){
number.textContent=n;
number.style.animation="none";
void number.offsetWidth;
number.style.animation="countdownFade 1s ease";
await wait(1000);
}
countdown.style.display="none";
try{
await imagePromise
}catch(e){
console.error("이미지를 불러오지 못했습니다.",e);
button.disabled=false;
return
}
$("cardImage").src=image;
$("cardText").textContent=text;
cardResult.style.display="block";
requestAnimationFrame(()=>requestAnimationFrame(()=>{
cardResult.classList.add("show");
setTimeout(()=>commentSection.classList.add("show"),5000);
}));
button.disabled=false
}
$("startButton").addEventListener("click",startExperience);
$("messageButton").addEventListener("click",drawCard);
$("commentToggle").addEventListener("click",()=>{
const form=$("commentForm");
form.style.display=form.style.display==="block"?"none":"block";
});
$("commentSubmit").addEventListener("click",async()=>{
const input=$("commentInput"),message=input.value.trim();
if(!message)return;
const button=$("commentSubmit");
button.disabled=true;
try{
await fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({comment:message})});
input.value="";
$("savedMessage").style.display="block";
}catch(e){
console.error(e)
}
button.disabled=false
});
loadData();
</script>
</body>
</html>
