<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>타로 랜덤 카드</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;

            text-align: center;

            background: #f7f3ee;

            color: #333;
        }


        /* =========================
           전체 영역
        ========================= */

        .container {
            width: 100%;
            max-width: 700px;

            margin: 0 auto;

            padding: 60px 20px;
        }


        /* =========================
           제목
        ========================= */

        h1 {
            margin: 0 0 30px;

            font-size: 36px;

            font-weight: 600;

            letter-spacing: -1px;
        }


        /* =========================
           카드 뽑기 버튼
        ========================= */

        #drawButton {

            padding: 16px 38px;

            border: none;

            border-radius: 50px;

            background: #333;

            color: white;

            font-size: 18px;

            font-weight: 500;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        #drawButton:hover {
            background: #555;

            transform: translateY(-2px);
        }

        #drawButton:active {
            transform: translateY(0);
        }

        #drawButton:disabled {

            background: #aaa;

            cursor: default;

            transform: none;
        }


        /* =========================
           결과 영역
        ========================= */

        #result {

            margin-top: 50px;

            min-height: 500px;
        }


        /* =========================
           카운트다운
        ========================= */

        #countdown {

            display: none;

            height: 500px;

            align-items: center;

            justify-content: center;

            font-size: 100px;

            font-weight: 600;

            color: #333;

            animation: countdownFade 1s ease;
        }


        @keyframes countdownFade {

            0% {
                opacity: 0;
                transform: scale(1.3);
            }

            30% {
                opacity: 1;
                transform: scale(1);
            }

            70% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(0.8);
            }
        }


        /* =========================
           카드 결과
        ========================= */

        #cardResult {

            display: none;

            opacity: 0;

            transform: translateY(10px);

            transition:
                opacity 0.5s ease,
                transform 0.5s ease;
        }


        #cardResult.show {

            opacity: 1;

            transform: translateY(0);
        }


        /* =========================
           카드 이미지
        ========================= */

        #cardImage {

            display: block;

            width: auto;

            max-width: 100%;

            max-height: 500px;

            margin: 0 auto 30px;

            border-radius: 12px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.15);
        }


        /* =========================
           카드 텍스트
        ========================= */

        #cardText {

            max-width: 600px;

            margin: 0 auto;

            font-size: 20px;

            line-height: 1.8;

            letter-spacing: -0.3px;

            word-break: keep-all;
        }


        /* =========================
           오류 메시지
        ========================= */

        #errorMessage {

            margin-top: 30px;

            color: #d33;

            font-size: 15px;
        }


        /* =========================
           모바일
        ========================= */

        @media (max-width: 600px) {

            .container {
                padding: 40px 15px;
            }

            h1 {
                font-size: 28px;
            }

            #countdown {
                font-size: 80px;
            }

            #cardImage {
                max-height: 420px;
            }

            #cardText {
                font-size: 17px;
            }
        }

    </style>

</head>


<body>


<div class="container">

    <h1>타로 랜덤 카드</h1>

    <button id="drawButton">
        카드 뽑기
    </button>


    <div id="result">

        <!-- 카운트다운 -->
        <div id="countdown">
            <span id="countdownNumber"></span>
        </div>


        <!-- 카드 결과 -->
        <div id="cardResult">

            <img
                id="cardImage"
                src=""
                alt="타로 카드"
            >

            <div id="cardText"></div>

        </div>


        <!-- 오류 메시지 -->
        <div id="errorMessage"></div>

    </div>

</div>



<script>


/* =====================================================
   데이터 파일
===================================================== */

const IMAGE_DATA_URL =
    "https://raw.githubusercontent.com/softsweettarot/Message/main/images.txt";

const TEXT_DATA_URL =
    "https://raw.githubusercontent.com/softsweettarot/Message/main/texts.txt";


/* =====================================================
   배열
===================================================== */

let images = [];

let texts = [];


/* =====================================================
   Google Drive URL 변환
===================================================== */

function convertGoogleDriveUrl(url) {

    url = url.trim();

    const match =
        url.match(/\/d\/([a-zA-Z0-9_-]+)/);

    if (match) {

        const fileId = match[1];

        return (
            "https://drive.google.com/thumbnail" +
            "?id=" +
            fileId +
            "&sz=w1000"
        );
    }

    return url;
}


/* =====================================================
   데이터 불러오기
===================================================== */

async function loadData() {

    try {

        const [
            imageResponse,
            textResponse
        ] = await Promise.all([

            fetch(IMAGE_DATA_URL),

            fetch(TEXT_DATA_URL)

        ]);


        if (!imageResponse.ok) {

            throw new Error(
                "images.txt를 불러오지 못했습니다."
            );

        }


        if (!textResponse.ok) {

            throw new Error(
                "texts.txt를 불러오지 못했습니다."
            );

        }


        const imageData =
            await imageResponse.text();

        const textData =
            await textResponse.text();


        /* 이미지 배열 */

        images = imageData

            .split(/\r?\n/)

            .map(line => line.trim())

            .filter(line => line !== "")

            .map(line =>
                convertGoogleDriveUrl(line)
            );


        /* 텍스트 배열 */

        texts = textData

            .split(/\r?\n/)

            .map(line => line.trim())

            .filter(line => line !== "");


        console.log(
            "이미지 개수:",
            images.length
        );

        console.log(
            "텍스트 개수:",
            texts.length
        );


        /* 개수 확인 */

        if (
            images.length !==
            texts.length
        ) {

            throw new Error(

                "이미지와 텍스트의 개수가 다릅니다. " +

                "이미지: " +
                images.length +
                "개 / " +

                "텍스트: " +
                texts.length +
                "개"

            );
        }


        console.log(
            "카드 데이터 로딩 완료!"
        );


        /*
         * 미리 이미지 캐시
         *
         * 첫 카드부터 이미지가 늦게 뜨는 것을
         * 줄이기 위해 모든 이미지를 브라우저에
         * 미리 로딩해 둡니다.
         */

        preloadAllImages();


    } catch (error) {

        console.error(
            "데이터 로딩 오류:",
            error
        );


        document
            .getElementById("errorMessage")
            .textContent =
                error.message;
    }
}



/* =====================================================
   모든 이미지 미리 로딩
===================================================== */

function preloadAllImages() {

    images.forEach(url => {

        const img =
            new Image();

        img.src = url;

    });

}



/* =====================================================
   선택한 이미지 하나를 미리 로딩
===================================================== */

function preloadImage(url) {

    return new Promise((resolve, reject) => {

        const img =
            new Image();


        img.onload = function() {

            resolve(img);

        };


        img.onerror = function() {

            reject(
                new Error(
                    "이미지를 불러오지 못했습니다."
                )
            );

        };


        img.src = url;

    });

}



/* =====================================================
   카드 뽑기
===================================================== */

async function drawCard() {


    /* 데이터가 없는 경우 */

    if (
        images.length === 0 ||
        texts.length === 0
    ) {

        alert(
            "카드 데이터를 아직 불러오지 못했습니다."
        );

        return;
    }


    /* 배열 개수 확인 */

    if (
        images.length !==
        texts.length
    ) {

        alert(
            "이미지와 텍스트의 개수가 일치하지 않습니다."
        );

        return;
    }


    /* 버튼 비활성화 */

    const button =
        document.getElementById(
            "drawButton"
        );

    button.disabled = true;


    /* 기존 오류 제거 */

    document
        .getElementById("errorMessage")
        .textContent = "";


    /* 기존 카드 숨기기 */

    const cardResult =
        document.getElementById(
            "cardResult"
        );

    cardResult.classList.remove("show");

    cardResult.style.display = "none";


    /* =================================================
       랜덤 카드 결정
    ================================================= */

    const randomIndex =
        Math.floor(
            Math.random() *
            images.length
        );


    const selectedImage =
        images[randomIndex];

    const selectedText =
        texts[randomIndex];


    console.log(
        "선택된 카드 배열 번호:",
        randomIndex
    );


    console.log(
        "선택된 이미지:",
        selectedImage
    );


    console.log(
        "선택된 텍스트:",
        selectedText
    );



    /* =================================================
       카운트다운 시작
    ================================================= */

    const countdown =
        document.getElementById(
            "countdown"
        );

    const countdownNumber =
        document.getElementById(
            "countdownNumber"
        );


    countdown.style.display =
        "flex";


    /* =================================================
       이미지 미리 로딩 시작

       ★ 중요 ★

       5초 카운트다운과 동시에
       이미지 로딩을 시작합니다.
    ================================================= */

    const imagePromise =
        preloadImage(
            selectedImage
        );



    /* =================================================
       5 → 4 → 3 → 2 → 1
    ================================================= */

    for (
        let number = 5;
        number >= 1;
        number--
    ) {


        countdownNumber.textContent =
            number;


        /*
         * 숫자가 바뀔 때마다
         * 애니메이션을 다시 실행
         */

        countdownNumber.style.animation =
            "none";


        /*
         * 브라우저가 스타일을
         * 다시 계산하도록 함
         */

        void countdownNumber.offsetWidth;


        countdownNumber.style.animation =
            "countdownFade 1s ease";


        /*
         * 1초 기다림
         */

        await wait(1000);

    }



    /* =================================================
       카운트다운 종료
    ================================================= */

    countdown.style.display =
        "none";



    /* =================================================
       이미지 로딩 완료까지 기다림

       5초 안에 이미지가 이미 로딩됐다면
       바로 진행됩니다.

       아직 로딩 중이라면 이미지가 준비될
       때까지 기다립니다.
    ================================================= */

    try {

        await imagePromise;

    } catch (error) {

        console.error(
            error
        );


        document
            .getElementById(
                "errorMessage"
            )
            .textContent =
                "이미지를 불러오지 못했습니다. Google Drive 공유 설정을 확인해주세요.";


        button.disabled = false;

        return;
    }



    /* =================================================
       이미지와 텍스트를 동시에 준비
    ================================================= */

    const cardImage =
        document.getElementById(
            "cardImage"
        );

    const cardText =
        document.getElementById(
            "cardText"
        );


    /*
     * 이미 로딩이 끝난 이미지 URL을
     * 실제 화면에 적용
     */

    cardImage.src =
        selectedImage;


    /*
     * 텍스트도 동시에 적용
     */

    cardText.textContent =
        selectedText;



    /* =================================================
       카드 표시
    ================================================= */

    cardResult.style.display =
        "block";


    /*
     * 브라우저가 이미지와 텍스트를
     * DOM에 반영한 다음 동시에 나타나도록
     * 한 프레임 기다림
     */

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            cardResult.classList.add(
                "show"
            );

        });

    });


    /* 버튼 다시 활성화 */

    button.disabled = false;

}



/* =====================================================
   시간 기다리기
===================================================== */

function wait(milliseconds) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                milliseconds
            )
    );

}



/* =====================================================
   이미지 오류 처리
===================================================== */

document
    .getElementById("cardImage")
    .addEventListener(
        "error",
        function() {

            console.error(
                "이미지 불러오기 실패:",
                this.src
            );


            document
                .getElementById(
                    "errorMessage"
                )
                .textContent =
                    "이미지를 불러오지 못했습니다. Google Drive의 공유 설정을 확인해주세요.";

        }
    );



/* =====================================================
   버튼 이벤트
===================================================== */

document
    .getElementById("drawButton")
    .addEventListener(
        "click",
        drawCard
    );



/* =====================================================
   페이지 시작
===================================================== */

loadData();


</script>

</body>
</html>
